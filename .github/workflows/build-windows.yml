name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch and deps
        run: |
          python -m pip install -U pip wheel
          pip install torch==2.1.1 torchvision==0.16.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cpu.txt

      - name: Download vits weights
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor/checkpoints | Out-Null
          curl.exe -L --retry 8 --retry-all-errors -o vendor/checkpoints/video_depth_anything_vits.pth "https://huggingface.co/depth-anything/Video-Depth-Anything-Small/resolve/main/video_depth_anything_vits.pth"
          if ((Get-Item vendor/checkpoints/video_depth_anything_vits.pth).Length -lt 50000000) { throw "weights download too small" }

      - name: PyInstaller Windows onefile
        run: pyinstaller --noconfirm --clean VideoDepthApp-windows.spec

      - name: List dist
        shell: pwsh
        run: Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDepthApp-windows
          path: |
            dist/VideoDepthApp.exe
            dist/*.exe
          if-no-files-found: error
          compression-level: 0

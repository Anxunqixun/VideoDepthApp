name: Build Windows portable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Assemble signed portable folder
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows_portable.ps1

      - name: Zip folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VideoDepthApp -DestinationPath dist/VideoDepthApp-windows.zip -Force
          Get-Item dist/VideoDepthApp-windows.zip | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDepthApp-windows-portable
          path: dist/VideoDepthApp-windows.zip
          if-no-files-found: error
          compression-level: 0

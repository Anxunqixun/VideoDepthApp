name: Build Windows Nuitka

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-nuitka:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install runtime and Nuitka
        run: |
          python -m pip install -U pip wheel
          pip install -r requirements-build.txt

      - name: Nuitka CLI
        run: |
          python -m nuitka --standalone --onefile --assume-yes-for-downloads --lto=no --output-dir=dist --output-filename=vda-cli.exe --include-data-files=models/vda_vits_t1.onnx=models/vda_vits_t1.onnx --include-data-files=models/inferno.npy=models/inferno.npy --include-package=onnxruntime --include-package-data=onnxruntime --nofollow-import-to=IPython --nofollow-import-to=pytest --nofollow-import-to=unittest --nofollow-import-to=setuptools --nofollow-import-to=pip --nofollow-import-to=tkinter --nofollow-import-to=numpy.tests --nofollow-import-to=onnxruntime.datasets --nofollow-import-to=onnxruntime.tools --nofollow-import-to=onnxruntime.quantization --windows-console-mode=attach --remove-output vda_cli.py

      - name: Nuitka GUI
        run: |
          python -m nuitka --standalone --onefile --assume-yes-for-downloads --lto=no --output-dir=dist --output-filename=vda-gui.exe --enable-plugin=tk-inter --include-data-files=models/vda_vits_t1.onnx=models/vda_vits_t1.onnx --include-data-files=models/inferno.npy=models/inferno.npy --include-package=onnxruntime --include-package-data=onnxruntime --nofollow-import-to=IPython --nofollow-import-to=pytest --nofollow-import-to=unittest --nofollow-import-to=setuptools --nofollow-import-to=pip --nofollow-import-to=numpy.tests --nofollow-import-to=onnxruntime.datasets --nofollow-import-to=onnxruntime.tools --nofollow-import-to=onnxruntime.quantization --windows-console-mode=disable --remove-output vda_gui.py

      - name: List dist
        shell: pwsh
        run: Get-ChildItem dist -Recurse -File | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDepthApp-windows-nuitka
          path: |
            dist/vda-cli.exe
            dist/vda-gui.exe
          if-no-files-found: error
          compression-level: 0
